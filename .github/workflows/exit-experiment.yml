name: exit-experiment
on:
  push:
    branches: [claude/tmp-exit-experiment-1]
  workflow_dispatch:
env:
  LC_TOOLS_SPEC: "git+https://github.com/CellMigrationLab/LabConstrictor-Tools"
jobs:
  cfg:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.c.outputs.runs }}
      variants: ${{ steps.c.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          echo "runs=$(jq -r .runs exp_config.json)" >> "$GITHUB_OUTPUT"
          echo "variants=$(jq -c .variants exp_config.json)" >> "$GITHUB_OUTPUT"
  exp:
    needs: cfg
    name: ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.cfg.outputs.variants) }}
    env:
      LC_EXPECT_QT: PySide6
      EXP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.variant == 'V5' && '3.12' || '3.11' }}", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install "${{ env.LC_TOOLS_SPEC }}" -e ".[test-pyside6]"
      - run: pip list | grep -i -E "^(napari|PyQt|PySide|QtPy|shiboken|magicgui) "
        shell: bash
      - name: Mesa llvmpipe software OpenGL (Windows)
        shell: bash
        env:
          MESA_VERSION: "24.2.7"
          MESA_SHA256: adbb439c1bf833a1e24a735a6dea3c3ceaf8459dfddd811a12f5aa5c832ad3fe
        run: |
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          echo "${MESA_SHA256}  mesa.7z" | sha256sum -c -
          7z x mesa.7z -omesa -y > /dev/null
          PYDIR="$(dirname "$(python -c 'import sys; print(sys.executable)')")"
          cp mesa/x64/opengl32.dll mesa/x64/libgallium_wgl.dll mesa/x64/libglapi.dll "$PYDIR"/
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "QT_OPENGL=desktop" >> "$GITHUB_ENV"
      - name: Loop
        shell: bash
        working-directory: tests
        run: python -u _exp_loop.py ${{ needs.cfg.outputs.runs }} test_calibration_transitions.py
