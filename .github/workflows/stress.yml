name: stress
on:
  push:
    branches: ["claude/tmp-stress-*"]
  workflow_dispatch:
jobs:
  stress:
    timeout-minutes: 60
    name: stress (${{ matrix.os }}, ${{ matrix.qt }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    runs-on: windows-latest
    env:
      LC_EXPECT_QT: PySide6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install "git+https://github.com/CellMigrationLab/LabConstrictor-Tools" -e ".[test-pyside6]" minidump
      - name: Crash dumps (WER LocalDumps, mini)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\dumps | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpFolder -Value "D:\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpCount -Value 20 -PropertyType DWord -Force | Out-Null
      - name: Mesa llvmpipe software OpenGL (Windows)
        shell: bash
        env:
          MESA_VERSION: "24.2.7"
          MESA_SHA256: adbb439c1bf833a1e24a735a6dea3c3ceaf8459dfddd811a12f5aa5c832ad3fe
        run: |
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          echo "${MESA_SHA256}  mesa.7z" | sha256sum -c -
          7z x mesa.7z -omesa -y > /dev/null
          PYDIR="$(dirname "$(python -c 'import sys; print(sys.executable)')")"
          cp mesa/x64/opengl32.dll mesa/x64/libgallium_wgl.dll mesa/x64/libglapi.dll "$PYDIR"/
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "QT_OPENGL=desktop" >> "$GITHUB_ENV"
      - name: Repeat (4 loops in parallel: the runner is busy, which is when the exit crashes)
        shell: bash
        working-directory: tests
        run: |
          loop() {
            bad=0; codes=""
            for i in $(seq 1 25); do
              rc=0; python test_async_close.py > "run_$1_$i.log" 2>&1 || rc=$?
              codes="$codes $rc"
              if [ $rc -ne 0 ]; then bad=$((bad+1)); echo "::group::loop $1 run $i exit $rc"; tail -60 "run_$1_$i.log"; echo "::endgroup::"; fi
            done
            echo "$bad" > "../bad_$1.txt"; echo "STRESS shard ${{ matrix.shard }} loop $1: $bad failed of 25; exit codes:$codes"
          }
          for l in 1 2 3 4; do loop $l > "loop_$l.out" 2>&1 & done
          wait
          cat loop_*.out
          cat ../bad_*.txt | paste -sd+ | bc > ../bad.txt || true
          echo "SHARD ${{ matrix.shard }} total failed: $(cat ../bad.txt) of 100"
      - name: Dumps
        if: always()
        shell: bash
        run: |
          ls -la /d/dumps || true
          for f in /d/dumps/*.dmp; do [ -f "$f" ] && python tmp_probe/dump_info.py "$f"; done
          [ "$(cat bad.txt)" = "0" ]
