[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-labconstrictor"
version = "0.1.0a1"
description = "Run installed LabConstrictor apps from napari (one generic widget, forms generated from each tool's schema)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"   # napari 0.8+ needs 3.11+; this is the tested baseline (CI: 3.11). Python 3.10 means napari < 0.8: not tested here
# labconstrictor-tools >=0.3.0a1 (tag v0.3.0-alpha.1): the run-record helpers (runs.build_record / record_json / done_status) came in
# v0.2.0-rc.2, which still reports 0.2.0rc1 like rc.1, so no specifier could name them; 0.3.0a1 is the first version string that does.
# The plugin also looks for the three functions when it loads (_retention.require_run_helpers). A direct tag URL is not allowed in a
# published wheel. Keep this equal to _retention.TOOLS_MINIMUM (tests/test_run_record.py).
dependencies = ["labconstrictor-tools>=0.3.0a1", "napari", "magicgui", "qtpy", "numpy", "tifffile"]

[project.optional-dependencies]
# The plugin itself installs NO Qt backend (it uses qtpy, so it works with the user's napari). The GUI tests need exactly one,
# chosen explicitly; install one of these extras per environment, never two (never both Qt6 bindings in one process).
# napari's own extras carry its exclusions (Qt 6.11.0 and 6.11.1 are excluded at napari 0.9.2).
test-pyqt6 = ["napari[pyqt6]", "pandas", "scipy", "imageio"]      # recommended
# PySide6 6.12.0 loses one reference to None on every call that returns a null QObject (activePopupWidget, focusWidget, parent, ...); on
# Python 3.11 a long GUI run aborts with "none_dealloc" (3.12 made None immortal). 6.11.2 is clean on Linux. The cap is Linux-only: on macOS
# 6.11.2 segfaulted in tests/test_messages_points.py while 6.12.0 passed there and on Windows. Remove the cap once PySide6 fixes it.
test-pyside6 = ["napari[pyside6]", "PySide6<6.12; sys_platform == 'linux'", "pandas", "scipy", "imageio"]  # recommended

[project.urls]
Repository = "https://github.com/CellMigrationLab/LabConstrictor-napari"

[project.entry-points."napari.manifest"]
napari-labconstrictor = "napari_labconstrictor:napari.yaml"

[tool.setuptools]
packages = ["napari_labconstrictor"]

[tool.setuptools.package-data]
napari_labconstrictor = ["napari.yaml"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "RUF"]
ignore = ["E501", "UP031", "UP032", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E402", "B007", "E741", "E731",   # scripts: short names in one-line checks, throwaway lambdas
    "S603", "S607",                    # the tests start the example app's CLI/worker with fixed argument lists, no shell
    "RUF100",                          # these scripts carry noqa comments for E402 that the ignore above makes redundant; tests are not edited in this pass
    "SIM115",                          # a log file kept open for the length of a test, closed in its cleanup
]

[tool.mypy]
# Checked: the package, the tests and the scripts. Every function in all of them is fully annotated (scripts/check_annotations.py
# checks the same rule without running mypy).
files = ["napari_labconstrictor", "tests", "scripts"]
python_version = "3.11"
disallow_untyped_defs = true    # every function is annotated; keep it that way
disallow_incomplete_defs = true
ignore_missing_imports = true   # tifffile and labconstrictor_tools ship no usable stubs (napari, magicgui, qtpy are installed and typed)
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false         # most values come from untyped Qt/magicgui calls
no_implicit_optional = true

[[tool.mypy.overrides]]
# The tests are standalone scripts (run under xvfb, one per file, importing each other as top-level modules: `import _paths`), so mypy
# names them by file name and a pattern like "tests.*" cannot match them: every tests/*.py is listed here. A new test file is added to
# this list (a file left out is simply checked with every error code, which is stricter, never looser).
# Every function in them is annotated and the names in the annotations resolve; the bodies are checked for everything EXCEPT the codes
# below. Each code is a kind of statement the test style needs, and the stubs make them noisy: `QApplication.instance()` is Optional
# (union-attr, one `processEvents` per helper), the QTest overloads and tifffile/numpy keyword dicts (arg-type, call-overload,
# call-arg), module functions and classes replaced on purpose to isolate a test (assignment, method-assign, misc, attr-defined),
# a function attribute used as a counter, empty containers filled later (var-annotated), `[t.start() for t in threads]`
# (func-returns-value), and results of the tools read as plain dicts (index, operator, type-var).
module = [
    "_async", "_calhelpers", "_channelhelpers", "_harness", "_linkedhelpers", "_numhelpers", "_paths", "_runtools",
    "lctest_async", "lctest_numbers", "lctest_runapp", "test_adversarial_hints", "test_app_hosts", "test_app_hosts_widget", "test_async_bounded",
    "test_async_cache", "test_async_cancel", "test_async_close", "test_async_conformance", "test_async_run",
    "test_async_stale", "test_calibration", "test_calibration_text", "test_calibration_transitions",
    "test_channel_memory", "test_channels", "test_channels_hyperstack", "test_channels_rgb", "test_coordinate_frame",
    "test_coordinate_frame_run", "test_copy_command", "test_file_sources", "test_form_fixes", "test_layer_choices", "test_form_gc_thread", "test_harness_exit",
    "test_interactions", "test_messages_points", "test_number_conformance", "test_number_grammar",
    "test_number_limits", "test_number_linked", "test_number_linked_run", "test_number_linked_states",
    "test_number_run", "test_number_text", "test_parity_copy_notes", "test_parity_dimensions",
    "test_parity_integer_limit", "test_parity_messages", "test_parity_points_frame", "test_parity_region",
    "test_parity_results", "test_parity_worker_close", "test_presentation", "test_qt_backend", "test_region",
    "test_results_and_workers", "test_retention_exit", "test_retention_markers", "test_retention_prune_real",
    "test_run_identity", "test_run_record", "test_run_button", "test_run_state", "test_scroll", "test_shapes", "test_units",
    "test_widget", "test_widget_hardening", "test_widgets",
    "ui_audit", "ui_audit_controls", "ui_audit_core", "ui_audit_forms", "ui_audit_place", "ui_audit_runs", "ui_audit_watch",
    "ui_synthetic_napari", "ui_audit_probe_app", "test_ui_audit", "test_ui_audit_regressions",
]
disable_error_code = [
    "arg-type", "assignment", "attr-defined", "call-arg", "call-overload", "func-returns-value", "index", "method-assign", "misc",
    "operator", "type-var", "union-attr", "var-annotated",
]
warn_unused_ignores = false   # a "type: ignore" in a test may silence exactly one of the codes turned off above
