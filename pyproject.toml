[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-labconstrictor"
version = "0.1.0"
description = "Run installed LabConstrictor apps from napari (one generic widget, forms generated from each tool's schema)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"   # napari 0.8+ needs 3.11+; this is the tested baseline (CI: 3.11). Python 3.10 means napari < 0.8: not tested here
dependencies = ["labconstrictor-tools>=0.1", "napari", "magicgui", "qtpy", "numpy", "tifffile", "pint"]

[project.optional-dependencies]
# The plugin itself installs NO Qt backend (it uses qtpy, so it works with the user's napari). The GUI tests need exactly one,
# chosen explicitly; install one of these extras per environment, never two (never both Qt6 bindings in one process).
# napari's own extras carry its exclusions (Qt 6.11.0 and 6.11.1 are excluded at napari 0.9.2).
test-pyqt6 = ["napari[pyqt6]", "pandas", "scipy", "imageio"]      # recommended
test-pyside6 = ["napari[pyside6]", "pandas", "scipy", "imageio"]  # recommended
test-pyqt5 = ["napari[pyqt5]", "pandas", "scipy", "imageio"]      # DEPRECATED legacy (napari deprecated PyQt5 in 0.8.0); retire with napari's Qt5 removal

[project.urls]
Repository = "https://github.com/CellMigrationLab/napari-labconstrictor"

[project.entry-points."napari.manifest"]
napari-labconstrictor = "napari_labconstrictor:napari.yaml"

[tool.setuptools]
packages = ["napari_labconstrictor"]

[tool.setuptools.package-data]
napari_labconstrictor = ["napari.yaml"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "RUF"]
ignore = ["E501", "UP031", "UP032", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E402", "B007", "E741", "E731",   # scripts: short names in one-line checks, throwaway lambdas
    "S603", "S607",                    # the tests start the example app's CLI/worker with fixed argument lists, no shell
    "RUF100",                          # these scripts carry noqa comments for E402 that the ignore above makes redundant; tests are not edited in this pass
    "SIM115",                          # a log file kept open for the length of a test, closed in its cleanup
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # pint, tifffile and labconstrictor_tools ship no usable stubs (napari, magicgui, qtpy are installed and typed)
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false         # most values come from untyped Qt/magicgui calls
no_implicit_optional = true
